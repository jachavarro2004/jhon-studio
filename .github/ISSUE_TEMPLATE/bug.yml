name: Bug report
description: Something in jhon-studio does not work as its docs say.
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, and the smallest studio.yaml and script.json that show it. Remove any private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `jhon-studio --version` and `node --version`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `jhon-studio doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: How you ran it
      options: [On its own, Claude Code plugin, Jhon in pi, Jhon in Claude Code]
    validations:
      required: true
