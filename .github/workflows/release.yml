# jhon-studio's release: on a tag vX.Y.Z (or vX.Y.Z-rc.N, a pre-release) of
# this repository, jachavarro2004/jhon-studio, run the tests on the tagged
# commit, refuse a tag that differs from src/version.ts, pack the tarball
# (tools/pack.sh), sign it with cosign keyless and publish one GitHub
# release with the CHANGELOG's section as its notes (tools/notes.sh). The
# signer identity is this file at that tag:
#   https://github.com/jachavarro2004/jhon-studio/.github/workflows/release.yml@refs/tags/<tag>
# src/version.ts's SIGNER_IDENTITY is that pattern, and README's install
# lines verify exactly it, so renaming or moving this file breaks every
# check of a release. Every job runs only in jachavarro2004/jhon-studio: a
# tag pushed to a fork never builds, signs or publishes.

name: release

on:
  push:
    tags:
      - "v*.*.*"

# Per job: the build job signs (id-token), only publish writes (contents).
permissions: {}

# One run per tag, never cancelled: a second push of the same tag waits
# instead of cutting a release in half.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # src/version.ts's SIGNER_ISSUER and SIGNER_IDENTITY, verbatim (a test checks it).
  SIGNER_ISSUER: https://token.actions.githubusercontent.com
  SIGNER_IDENTITY: ^https://github\.com/jachavarro2004/jhon-studio/\.github/workflows/release\.yml@refs/tags/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-rc\.(0|[1-9]\d*))?$

jobs:
  tag:
    name: check the tag
    if: github.repository == 'jachavarro2004/jhon-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N (no leading zeros)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: test, pack and sign
    if: github.repository == 'jachavarro2004/jhon-studio'
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      TAG: ${{ github.ref_name }}
      # Inside the checkout, but outside every folder pack.sh packs.
      OUT: ${{ github.workspace }}/dist-out
    steps:
      - name: Check out ${{ github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node (the current LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: The tag is src/version.ts's version
        run: |
          v=$(node --experimental-strip-types --no-warnings bin/jhon-studio --version)
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG differs from src/version.ts's version $v: set VERSION (and plugin.json) to $VERSION, or tag v$v"
            exit 1
          fi

      # No models, no GPU, no render (as ci.yml): the release is the tested commit.
      - name: Run the tests
        run: node --experimental-strip-types --no-warnings --test test/*.test.ts

      - name: Pack the release
        run: |
          git status --porcelain
          tarball=$(tools/pack.sh "$OUT")
          test "$(basename "$tarball")" = "jhon-studio-$VERSION.tar.gz"
          (cd "$OUT" && sha256sum -c "jhon-studio-$VERSION.tar.gz.sha256")
          # The same commit packs to the same bytes.
          again=$(mktemp -d)
          tools/pack.sh "$again" > /dev/null
          cmp "$tarball" "$again/jhon-studio-$VERSION.tar.gz"
          tar -tzvf "$tarball"

      - name: Release notes from the CHANGELOG
        run: tools/notes.sh "$VERSION" > "$OUT/notes.md"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign and verify the tarball
        run: |
          f="$OUT/jhon-studio-$VERSION.tar.gz"
          test -f "$f"
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          cosign verify-blob --bundle "$f.sigstore.json" \
            --certificate-identity-regexp "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$SIGNER_ISSUER" \
            "$f"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist-out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish ${{ github.ref_name }}
    if: github.repository == 'jachavarro2004/jhon-studio'
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist-out

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          cd dist-out
          assets=()
          for ext in tar.gz tar.gz.sha256 tar.gz.sigstore.json; do
            f="jhon-studio-$VERSION.$ext"
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
            assets+=("$f")
          done
          test -s notes.md || { echo "::error::missing notes.md"; exit 1; }
          # An rc is a pre-release: /releases/latest never offers one.
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "jhon-studio $VERSION" --notes-file notes.md "${flags[@]}"
