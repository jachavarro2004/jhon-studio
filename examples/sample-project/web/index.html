<!doctype html>
<!-- Larder's shopping list as a static page (a fictional project): jhon-studio captures it as a web screen. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Larder: shopping list</title>
    <style>
      body { margin: 0; background: #141a19; color: #eef4f1; font: 28px/1.4 sans-serif; }
      header { display: flex; align-items: center; gap: 24px; padding: 24px 48px; background: #1b2422; border-bottom: 2px solid #2a3533; }
      header b { color: #7fd1b9; font: italic 600 44px serif; }
      main { padding: 40px 48px; display: grid; grid-template-columns: 1fr 560px; gap: 40px; }
      .panel { background: #1b2422; padding: 28px 32px; }
      .panel h2 { margin: 0 0 16px; font-size: 22px; letter-spacing: 0.12em; color: #7fd1b9; }
      li { padding: 10px 0; border-bottom: 2px solid #2a3533; list-style: none; }
      ul { margin: 0; padding: 0; }
      input { width: 100%; box-sizing: border-box; font: inherit; padding: 12px 16px; background: #141a19; color: inherit; border: 2px solid #2a3533; }
      button { margin-top: 20px; font: inherit; padding: 14px 24px; background: #7fd1b9; color: #141a19; border: 0; cursor: pointer; }
      #added { color: #7fd1b9; }
    </style>
  </head>
  <body>
    <header><b>Larder</b><span>Shopping list</span></header>
    <main>
      <section class="panel" id="list">
        <h2>TO BUY</h2>
        <ul id="items"><li>Lentils</li><li>Lemons</li><li>Yogurt</li></ul>
      </section>
      <section class="panel" id="add">
        <h2>ADD AN ITEM</h2>
        <input id="item" placeholder="Something missing?" />
        <button id="add-button">Add to the list</button>
      </section>
    </main>
    <script>
      document.getElementById("add-button").addEventListener("click", () => {
        const v = document.getElementById("item").value.trim();
        if (!v) return;
        const li = document.createElement("li");
        li.id = "added";
        li.textContent = v;
        document.getElementById("items").append(li);
        document.getElementById("item").value = "";
      });
    </script>
  </body>
</html>
